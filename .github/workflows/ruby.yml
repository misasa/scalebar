name: Ruby

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.6.10'
            bundler: '2.4.22'
            rubygems: '3.4.22'
          - ruby: '4.0.7'
            bundler: '4.0.20'
            rubygems: '4.0.20'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Current ruby-builder releases provide 2.6.10 for Ubuntu 24.04 x64.
      # Bundler 2.4 / RubyGems 3.4 are the compatible lines for Ruby 2.6.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          rubygems: ${{ matrix.rubygems }}
          bundler-cache: true
      - name: Report the selected environment
        run: |
          command -v ruby
          ruby -v
          gem --version
          bundle --version
      - name: Verify specs, gem build and installed CLI
        run: bundle exec rake verify
      - name: Check RubyGems build warnings
        run: gem build scalebar.gemspec --strict --output pkg/scalebar-strict.gem

  package:
    name: Store verified gem
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.20'
          rubygems: '4.0.20'
          bundler-cache: true
      # Rebuild and verify this commit after both matrix jobs have passed.
      - name: Verify specs, gem build and installed CLI
        run: bundle exec rake verify
      - name: Select the verified gem
        id: package
        run: |
          gem_path="$(ruby -e 'puts "pkg/#{Gem::Specification.load("scalebar.gemspec").file_name}"')"
          printf 'path=%s\n' "$gem_path" >> "$GITHUB_OUTPUT"
          printf 'Commit: `%s`\nGem: `%s`\n' "$GITHUB_SHA" "$gem_path" >> "$GITHUB_STEP_SUMMARY"
      # Artifact metadata links its unique ID to this workflow run and head SHA.
      - name: Upload the verified gem
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scalebar-gem
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
