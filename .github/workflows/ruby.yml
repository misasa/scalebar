name: Ruby

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.6.10'
            bundler: '2.4.22'
            rubygems: '3.4.22'
          - ruby: '4.0.7'
            bundler: '4.0.20'
            rubygems: '4.0.20'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Current ruby-builder releases provide 2.6.10 for Ubuntu 24.04 x64.
      # Bundler 2.4 / RubyGems 3.4 are the compatible lines for Ruby 2.6.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          rubygems: ${{ matrix.rubygems }}
          bundler-cache: true
      - name: Report the selected environment
        run: |
          command -v ruby
          ruby -v
          gem --version
          bundle --version
      - name: Verify specs, gem build and installed CLI
        run: bundle exec rake verify
      - name: Check RubyGems build warnings
        run: gem build scalebar.gemspec --strict --output pkg/scalebar-strict.gem
